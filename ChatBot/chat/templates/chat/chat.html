<!DOCTYPE html>
<html>
<head>
  <title>Chatbot</title>
  <script>
    async function sendMessage() {
      const input = document.getElementById("message").value;
      if (!input.trim()) return;

      const responseBox = document.getElementById("response");
      const timeBox = document.getElementById("elapsed");
      responseBox.textContent = "응답 대기 중...";
      timeBox.textContent = "";

      const res = await fetch("/chat/chat/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: input})
      });
      const data = await res.json();
      if (data.response) {
        responseBox.textContent = data.response;
        timeBox.textContent = data.message || "";
      } else {
        responseBox.textContent = "오류 발생: " + (data.error || "알 수 없음");
        timeBox.textContent = "";
      }
    }
  </script>
</head>
<body>
  <h1>Chatbot</h1>
  <textarea id="message" rows="4" cols="50" placeholder="질문 입력..." style="overflow: auto;"></textarea><br>
  <button onclick="sendMessage()">전송</button>
  <p><strong>답변:</strong></p>
  <div id="response" style="white-space: pre-wrap; border: 1px solid #ccc; padding: 10px; width: 500px; height: 150px; overflow: auto;"></div>
  <p><em id="elapsed" style="color: gray; margin-top: 5px;"></em></p>
</body>
</html>
