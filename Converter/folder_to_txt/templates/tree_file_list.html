<ul class="list-unstyled ms-3">
    {% for name, subtree in tree.items %}
        {% if subtree %}
            <li>
                <strong>DIR: {{ prefix }}{{ name }}/</strong>
                {% include "tree_file_list.html" with tree=subtree prefix=prefix|add:name|add:"/" %}
            </li>
        {% else %}
            <li class="form-check file-item">
                <input class="form-check-input file-checkbox" type="checkbox" name="selected_files"
                       value="{{ prefix }}{{ name }}" id="cb_{{ forloop.counter }}">
                <label class="form-check-label" for="cb_{{ forloop.counter }}">
                    FILE: {{ prefix }}{{ name }}
                </label>
            </li>
        {% endif %}
    {% empty %}
        <li>⚠️ 트리 데이터가 비어 있습니다</li>
    {% endfor %}
</ul>
