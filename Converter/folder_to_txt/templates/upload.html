{% extends "converter/base.html" %}
{% block title %}파일/폴더 업로드{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">파일/폴더 업로드</h4>
                </div>
                <div class="card-body">
                    {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}
                    <form method="post" enctype="multipart/form-data" action="{% url 'folder_to_txt:index' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="zipFile" class="form-label">ZIP 파일 업로드</label>
                            <input class="form-control" type="file" id="zipFile" name="zip_file" accept=".zip">
                        </div>
                        <div class="mb-3">
                            <label for="folderFiles" class="form-label">폴더 업로드 (여러 파일)</label>
                            <input class="form-control" type="file" id="folderFiles" name="folder_files" webkitdirectory directory multiple>
                            <div class="form-text">폴더 전체를 선택하려면 폴더 선택 버튼을 사용하세요. (크롬/엣지 지원)</div>
                        </div>
                        <div id="drop-area" class="mb-3 p-4 border border-primary rounded text-center" style="background: #f8f9fa;">
                            <p class="mb-2">여기로 파일이나 폴더를 드래그하세요</p>
                            <p class="small text-muted">ZIP 파일 또는 폴더 전체를 지원합니다</p>
                        </div>
                        <!-- 미리보기 영역 -->
                        <div id="preview-area" class="mb-3" style="display:none;">
                            <h6>내부 파일 목록 미리보기</h6>
                            <ul id="file-list" class="list-group small"></ul>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">업로드</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
const dropArea = document.getElementById('drop-area');
const zipInput = document.getElementById('zipFile');
const folderInput = document.getElementById('folderFiles');
const previewArea = document.getElementById('preview-area');
const fileList = document.getElementById('file-list');

// 기본 이벤트 방지
['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    dropArea.addEventListener(eventName, e => e.preventDefault(), false);
    dropArea.addEventListener(eventName, e => e.stopPropagation(), false);
});

// 시각적 효과
['dragenter', 'dragover'].forEach(eventName => {
    dropArea.classList.remove('bg-primary', 'text-white');
    dropArea.addEventListener(eventName, () => dropArea.classList.add('bg-primary', 'text-white'), false);
});
['dragleave', 'drop'].forEach(eventName => {
    dropArea.addEventListener(eventName, () => dropArea.classList.remove('bg-primary', 'text-white'), false);
});

// 파일 목록 미리보기 함수
function showPreview(files) {
    fileList.innerHTML = '';
    // 파일 리스트를 이름순 정렬
    const arr = Array.from(files).sort((a, b) => a.webkitRelativePath.localeCompare(b.webkitRelativePath));
    arr.forEach(file => {
        // 폴더 업로드 시에는 webkitRelativePath, ZIP은 name만 있음
        const path = file.webkitRelativePath || file.name;
        const li = document.createElement('li');
        li.className = 'list-group-item';
        li.textContent = path;
        fileList.appendChild(li);
    });
    previewArea.style.display = arr.length ? 'block' : 'none';
}

// 드롭 이벤트 처리
dropArea.addEventListener('drop', function(e) {
    const dt = e.dataTransfer;
    const files = dt.files;

    // ZIP 파일만 드롭: zipFile input에 할당
    if (files.length === 1 && files[0].name.endsWith('.zip')) {
        zipInput.files = files;
        zipInput.dispatchEvent(new Event('change'));
        showPreview(files);
    } else {
        // 폴더 또는 여러 파일 드롭: folderFiles input에 할당
        folderInput.files = files;
        folderInput.dispatchEvent(new Event('change'));
        showPreview(files);
    }
});

// 파일 선택(버튼 클릭) 시에도 미리보기 출력
zipInput.addEventListener('change', function() {
    if (zipInput.files.length > 0) showPreview(zipInput.files);
});
folderInput.addEventListener('change', function() {
    if (folderInput.files.length > 0) showPreview(folderInput.files);
});
</script>
{% endblock %}
