{% extends "base.html" %}
{% block content %}
<h1>게시판</h1>

<ul>
  {% for post in posts %}
  <li>
    <a href="{% url 'post_detail' post.id %}">{{ post.title }}</a>
    <small>by {{ post.author.username }} | {{ post.created_at|date:"Y-m-d" }}</small>
  </li>
  {% empty %}
  <li>게시글이 없습니다.</li>
  {% endfor %}
</ul>

<a href="{% url 'post_create' %}">새 게시글 작성</a>
{% endblock %}
